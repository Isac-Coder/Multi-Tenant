name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::824508926751:role/github-actions-deploy-role
          aws-region: us-east-2

      - name: Copiar archivos a EC2 via S3
        run: |
          zip -r deploy.zip . -x "*.git*"
          aws s3 cp deploy.zip s3://multi-tenant-deployments/deploy.zip

      - name: Desplegar en EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-011df516f099f8ad9" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://multi-tenant-deployments/deploy.zip /home/ubuntu/deploy.zip",
              "cd /home/ubuntu && unzip -o deploy.zip",
              "pm2 restart all || pm2 start app.js"
            ]'
